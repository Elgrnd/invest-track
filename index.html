<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Invest Track</title>
  <meta name="description" content="Suivi de l'argent investi en crypto et en bourse">
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Invest Track">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1 id="title">Crypto</h1>
    <p class="total-label">Total investi</p>
    <p class="total-amount" id="total">0,00 €</p>
    <div class="stats">
      <div><span id="yearLabel">En 2026</span><b id="yearTotal">0 €</b></div>
      <div><span>Moyenne / mois</span><b id="avg">0 €</b></div>
    </div>
  </header>

  <main>
    <section class="card" id="formCard">
      <h2 id="formTitle">Nouvel investissement</h2>
      <form id="form" autocomplete="off">
        <label class="full">
          <span>Mois</span>
          <input type="month" id="month" required>
        </label>
        <label>
          <span>Actif</span>
          <input type="text" id="asset" list="assets" placeholder="BTC, SOL…" required maxlength="40">
          <datalist id="assets"></datalist>
        </label>
        <label>
          <span>Montant (€)</span>
          <input type="number" id="amount" inputmode="decimal" step="0.01" min="0.01" placeholder="50" required>
        </label>
        <button type="submit" class="primary" id="submitBtn">Ajouter</button>
        <button type="button" class="full" id="cancelBtn" hidden>Annuler la modification</button>
      </form>
      <button type="button" class="repeat" id="repeatBtn" hidden></button>
    </section>

    <section class="card" id="splitCard">
      <h2 id="splitTitle">Répartition</h2>
      <div class="donut-wrap">
        <svg id="donut" viewBox="0 0 160 160" role="img" aria-label="Répartition"></svg>
        <div class="donut-center" id="donutCenter"></div>
      </div>
      <ul id="legend" class="legend"></ul>
    </section>

    <section class="card" id="chartCard">
      <h2>Évolution du total investi</h2>
      <div class="chart" id="chart"></div>
    </section>

    <section class="card">
      <h2>Historique</h2>
      <div id="history"></div>
      <p class="empty" id="emptyHistory">Aucun investissement pour l'instant.</p>
    </section>

    <section class="card backup">
      <h2>Sauvegarde</h2>
      <p class="hint">Les données sont enregistrées uniquement sur cet appareil. Exportez-les de temps en temps.</p>
      <div class="row">
        <button type="button" id="exportBtn">Exporter</button>
        <label class="button">Importer<input type="file" id="importInput" accept="application/json" hidden></label>
      </div>
    </section>
  </main>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="crypto" aria-selected="true">
      <span class="ico">₿</span><span>Crypto</span>
    </button>
    <button role="tab" data-tab="bourse" aria-selected="false">
      <span class="ico">📈</span><span>Bourse</span>
    </button>
    <button role="tab" data-tab="total" aria-selected="false">
      <span class="ico">Σ</span><span>Total</span>
    </button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
